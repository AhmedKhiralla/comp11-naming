<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comp11 - Admin Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1E8449;
            border-bottom: 2px solid #1E8449;
            padding-bottom: 10px;
        }

        h2 {
            margin-top: 30px;
        }

        .card {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #f39c12;
            border-radius: 4px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .btn-approve {
            background-color: #27ae60;
        }

        .btn-toggle {
            background-color: #2980b9;
            margin-bottom: 20px;
        }

        .btn-logout {
            background-color: #7f8c8d;
            float: right;
        }

        .mode-status {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .free-mode {
            color: #c0392b;
        }

        .paid-mode {
            color: #27ae60;
        }

        .error-box {
            background: #c0392b;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .success-box {
            background: #27ae60;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .receipt-btn {
            background-color: #f39c12;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
        }

        .delete-btn {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .order-actions {
            margin-top: 15px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* ========================= */
        /* LOGIN */
        /* ========================= */

        #loginPanel {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        #loginPanel h1 {
            margin-top: 0;
        }

        .login-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #1E8449;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        #loginError {
            display: none;
            background: #c0392b;
            color: white;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        #loginLoading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #555;
        }

        .admin-user {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>

<body>

<!-- ========================================================= -->
<!-- LOGIN PANEL -->
<!-- ========================================================= -->

<div id="loginPanel">

    <h1>Comp11 Labs</h1>

    <h2>Admin Login</h2>

    <div id="loginError"></div>

    <input
        type="email"
        id="adminEmail"
        class="login-input"
        placeholder="Admin email"
        autocomplete="username"
    >

    <input
        type="password"
        id="adminPassword"
        class="login-input"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button
        id="loginButton"
        class="login-btn"
        onclick="adminLogin()"
    >
        Login
    </button>

    <div id="loginLoading">
        Authenticating...
    </div>

</div>


<!-- ========================================================= -->
<!-- ADMIN PANEL -->
<!-- ========================================================= -->

<div class="container" id="adminPanel" style="display: none;">

    <!-- SYSTEM ALERT -->

    <div
        id="systemAlert"
        style="
            display:none;
            background:#c0392b;
            color:white;
            padding:15px;
            border-radius:6px;
            margin-bottom:20px;
            font-weight:bold;
            text-align:center;
        "
    >

        🚨 ATTENTION: The Selenium Worker has crashed or the EDA website structure has changed!

        <br>

        <span
            id="errorDetails"
            style="font-size:12px; font-weight:normal;"
        >
        </span>

    </div>


    <!-- FIREBASE ERROR -->

    <div id="firebaseError" class="error-box">

        <strong>Firebase Error</strong>

        <br>

        <span id="firebaseErrorDetails"></span>

    </div>


    <!-- SUCCESS -->

    <div id="successMessage" class="success-box"></div>


    <!-- HEADER -->

    <div class="clearfix">

        <h1 style="margin-bottom: 10px;">
            Comp11 Labs Admin
        </h1>

        <button
            class="btn btn-logout"
            onclick="adminLogout()"
        >
            Logout
        </button>

    </div>

    <div class="admin-user">
        Authenticated administrator
    </div>


    <!-- ========================================================= -->
    <!-- MODE -->
    <!-- ========================================================= -->

    <div>

        <div
            class="mode-status"
            id="modeDisplay"
        >
            Current Mode: Loading...
        </div>

        <button
            class="btn btn-toggle"
            onclick="toggleMode()"
        >
            Switch Paid/Free Mode
        </button>

    </div>


    <!-- ========================================================= -->
    <!-- ORDERS -->
    <!-- ========================================================= -->

    <h2>Pending InstaPay Orders</h2>

    <div id="pendingOrders">
        Loading orders...
    </div>

</div>


<!-- ========================================================= -->
<!-- FIREBASE -->
<!-- ========================================================= -->

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>


<script>

    // =========================================================
    // ADMIN UID
    // =========================================================

    const ADMIN_UID =
        "U3Kr4CtGk6NJTDtG6HhSm4qmsrJ3";


    // =========================================================
    // FIREBASE CONFIG
    // =========================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyCs40hr-B04Ti0FhUEE0SCg5yJHoCm9VTs",

        authDomain:
            "pharmanamingvault.firebaseapp.com",

        databaseURL:
            "https://pharmanamingvault-default-rtdb.europe-west1.firebasedatabase.app",

        projectId:
            "pharmanamingvault",

        storageBucket:
            "pharmanamingvault.firebasestorage.app",

        messagingSenderId:
            "301633731884",

        appId:
            "1:301633731884:web:b303f30dab1e0d116f4089"
    };


    // =========================================================
    // INITIALIZE FIREBASE
    // =========================================================

    try {

        firebase.initializeApp(firebaseConfig);

        console.log(
            "Firebase initialized successfully."
        );

    } catch (error) {

        console.error(
            "Firebase initialization error:",
            error
        );

        showLoginError(
            "Firebase initialization failed: " +
            error.message
        );
    }


    const auth =
        firebase.auth();

    const db =
        firebase.database();

    const storage =
        firebase.storage();


    let currentMode = false;


    // =========================================================
    // GLOBAL ERROR HANDLER
    // =========================================================

    window.addEventListener(
        "error",
        function(event) {

            console.error(
                "JavaScript Error:",
                event.error || event.message
            );

            if (
                typeof showFirebaseError === "function"
            ) {

                showFirebaseError(
                    "JavaScript error: " +
                    (
                        event.error?.message ||
                        event.message
                    )
                );
            }
        }
    );


    // =========================================================
    // LOGIN ERROR
    // =========================================================

    function showLoginError(message) {

        const box =
            document.getElementById("loginError");

        if (!box) return;

        box.style.display = "block";

        box.innerText = message;
    }


    function clearLoginError() {

        const box =
            document.getElementById("loginError");

        if (!box) return;

        box.style.display = "none";

        box.innerText = "";
    }


    // =========================================================
    // ADMIN LOGIN
    // =========================================================

    async function adminLogin() {

        clearLoginError();

        const email =
            document
                .getElementById("adminEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("adminPassword")
                .value;

        if (!email) {

            showLoginError(
                "Please enter your admin email."
            );

            return;
        }

        if (!password) {

            showLoginError(
                "Please enter your password."
            );

            return;
        }


        const button =
            document.getElementById(
                "loginButton"
            );

        const loading =
            document.getElementById(
                "loginLoading"
            );


        button.disabled = true;

        loading.style.display = "block";


        try {

            console.log(
                "Attempting Firebase admin login..."
            );


            const userCredential =
                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );


            const user =
                userCredential.user;


            console.log(
                "Firebase authentication successful."
            );

            console.log(
                "Authenticated UID:",
                user.uid
            );


            // =================================================
            // CRITICAL ADMIN UID CHECK
            // =================================================

            if (user.uid !== ADMIN_UID) {

                console.error(
                    "Unauthorized Firebase user:",
                    user.uid
                );


                await auth.signOut();


                showLoginError(
                    "Access denied. This Firebase account is not authorized as an administrator."
                );


                return;
            }


            console.log(
                "Admin UID verified successfully."
            );


            showAdminPanel();

        } catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            let message =
                "Login failed.";


            if (
                error.code ===
                "auth/invalid-login-credentials"
            ) {

                message =
                    "Invalid email or password.";

            } else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Invalid email or password.";

            } else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "No Firebase user exists with this email.";

            } else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "Too many failed login attempts. Please try again later.";

            } else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                message =
                    "Network error. Please check your internet connection.";

            } else {

                message =
                    error.message ||
                    "Unknown authentication error.";
            }


            showLoginError(message);

        } finally {

            button.disabled = false;

            loading.style.display = "none";
        }
    }


    // =========================================================
    // ENTER KEY LOGIN
    // =========================================================

    document
        .getElementById("adminPassword")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    adminLogin();
                }
            }
        );


    // =========================================================
    // SHOW ADMIN PANEL
    // =========================================================

    function showAdminPanel() {

        document
            .getElementById("loginPanel")
            .style.display = "none";


        document
            .getElementById("adminPanel")
            .style.display = "block";


        console.log(
            "Admin panel displayed."
        );


        startAdminListeners();
    }


    // =========================================================
    // HIDE ADMIN PANEL
    // =========================================================

    function hideAdminPanel() {

        document
            .getElementById("adminPanel")
            .style.display = "none";


        document
            .getElementById("loginPanel")
            .style.display = "block";


        document
            .getElementById("adminPassword")
            .value = "";
    }


    // =========================================================
    // AUTH STATE LISTENER
    // =========================================================

    auth.onAuthStateChanged(
        function(user) {

            console.log(
                "Auth state changed:",
                user ? user.uid : "No user"
            );


            if (!user) {

                hideAdminPanel();

                return;
            }


            // =================================================
            // VERIFY ADMIN UID AGAIN
            // =================================================

            if (user.uid !== ADMIN_UID) {

                console.error(
                    "Authenticated user is not admin:",
                    user.uid
                );


                auth.signOut();

                return;
            }


            console.log(
                "Existing admin session detected."
            );


            showAdminPanel();
        }
    );


    // =========================================================
    // LOGOUT
    // =========================================================

    async function adminLogout() {

        try {

            await auth.signOut();

            console.log(
                "Admin logged out."
            );

            hideAdminPanel();

        } catch (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "Logout failed:\n" +
                error.message
            );
        }
    }


    // =========================================================
    // FIREBASE ERROR
    // =========================================================

    function showFirebaseError(message) {

        const box =
            document.getElementById(
                "firebaseError"
            );

        const details =
            document.getElementById(
                "firebaseErrorDetails"
            );


        if (box && details) {

            box.style.display = "block";

            details.innerText = message;
        }
    }


    // =========================================================
    // SUCCESS MESSAGE
    // =========================================================

    function showSuccess(message) {

        const box =
            document.getElementById(
                "successMessage"
            );


        if (!box) return;


        box.innerText = message;

        box.style.display = "block";


        setTimeout(
            function() {

                box.style.display = "none";

            },
            5000
        );
    }


    // =========================================================
    // START ADMIN LISTENERS
    // =========================================================

    let listenersStarted = false;


    function startAdminListeners() {

        if (listenersStarted) {

            console.log(
                "Admin listeners already running."
            );

            return;
        }


        listenersStarted = true;


        startModeListener();

        startOrdersListener();

        startSystemHealthListener();
    }


    // =========================================================
    // MODE LISTENER
    // =========================================================

    function startModeListener() {

        db.ref(
            "settings/is_paid_mode"
        ).on(

            "value",

            function(snapshot) {

                console.log(
                    "Mode received:",
                    snapshot.val()
                );


                currentMode =
                    snapshot.val() === true;


                const display =
                    document.getElementById(
                        "modeDisplay"
                    );


                if (currentMode) {

                    display.innerHTML =
                        'Current Mode: <span class="paid-mode">' +
                        'PAID (InstaPay Required)' +
                        '</span>';

                } else {

                    display.innerHTML =
                        'Current Mode: <span class="free-mode">' +
                        'FREE (Auto-Approves)' +
                        '</span>';
                }

            },

            function(error) {

                console.error(
                    "Mode listener error:",
                    error
                );


                showFirebaseError(
                    "Cannot read settings/is_paid_mode: " +
                    error.message
                );
            }
        );
    }


    // =========================================================
    // TOGGLE MODE
    // =========================================================

    async function toggleMode() {

        const newMode =
            !currentMode;


        if (
            !confirm(
                "Are you sure you want to switch to " +
                (newMode ? "PAID" : "FREE") +
                " mode?"
            )
        ) {

            return;
        }


        try {

            await db
                .ref("settings/is_paid_mode")
                .set(newMode);


            console.log(
                "Mode changed to:",
                newMode
            );


            showSuccess(
                "Mode successfully changed to " +
                (newMode ? "PAID" : "FREE") +
                "."
            );

        } catch (error) {

            console.error(
                "Mode update error:",
                error
            );


            alert(
                "Failed to change mode:\n" +
                error.message
            );
        }
    }


    // =========================================================
    // ORDERS LISTENER
    // =========================================================

    function startOrdersListener() {

        console.log(
            "Starting orders listener..."
        );


        db.ref("orders").on(

            "value",

            function(snapshot) {

                console.log(
                    "Orders snapshot received."
                );


                console.log(
                    "Orders exist:",
                    snapshot.exists()
                );


                const container =
                    document.getElementById(
                        "pendingOrders"
                    );


                container.innerHTML = "";


                if (!snapshot.exists()) {

                    container.innerHTML =
                        "<p>No orders found in database.</p>";

                    return;
                }


                let hasPending = false;


                snapshot.forEach(
                    function(childSnapshot) {

                        const orderId =
                            childSnapshot.key;


                        const data =
                            childSnapshot.val();


                        console.log(
                            "Order:",
                            orderId,
                            data
                        );


                        const status =
                            String(
                                data.status || ""
                            ).toLowerCase();


                        // ONLY SHOW PENDING ORDERS

                        if (
                            status !==
                                "pending_payment" &&
                            status !==
                                "pending_verification"
                        ) {

                            return;
                        }


                        hasPending = true;


                        // =================================================
                        // RECEIPT
                        // =================================================

                        let receiptButtonHTML = "";


                        if (data.receipt_url) {

                            const safeReceiptUrl =
                                String(
                                    data.receipt_url
                                )
                                .replace(
                                    /"/g,
                                    "&quot;"
                                )
                                .replace(
                                    /'/g,
                                    "&#039;"
                                );


                            receiptButtonHTML = `

                                <a
                                    href="${safeReceiptUrl}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="receipt-btn"
                                >
                                    📄 View Evidence
                                </a>


                                <button
                                    class="delete-btn"
                                    onclick="deleteReceipt(
                                        '${escapeJs(orderId)}',
                                        '${safeReceiptUrl}'
                                    )"
                                >
                                    🗑️ Delete File
                                </button>

                            `;

                        } else {

                            receiptButtonHTML = `

                                <span
                                    style="
                                        color:#c0392b;
                                        font-size:13px;
                                        font-style:italic;
                                    "
                                >
                                    No receipt uploaded yet
                                </span>

                            `;
                        }


                        // =================================================
                        // DATE
                        // =================================================

                        let dateText =
                            "Unknown";


                        if (data.timestamp) {

                            const parsedDate =
                                new Date(
                                    data.timestamp
                                );


                            if (
                                !isNaN(
                                    parsedDate.getTime()
                                )
                            ) {

                                dateText =
                                    parsedDate.toLocaleString();
                            }
                        }


                        // =================================================
                        // CARD
                        // =================================================

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "card";


                        card.innerHTML = `

                            <h3>
                                Company:
                                ${escapeHtml(
                                    data.company_name ||
                                    "Unknown"
                                )}
                            </h3>


                            <p>
                                <b>API:</b>
                                ${escapeHtml(
                                    data.api_name ||
                                    "Unknown"
                                )}
                            </p>


                            <p>
                                <b>Email:</b>
                                ${escapeHtml(
                                    data.email ||
                                    "Unknown"
                                )}
                            </p>


                            <p>
                                <b>Dosage Form:</b>
                                ${escapeHtml(
                                    data.dosage_form ||
                                    "Unknown"
                                )}
                            </p>


                            <p>
                                <b>Category:</b>
                                ${escapeHtml(
                                    data.category ||
                                    "Unknown"
                                )}
                            </p>


                            <p>
                                <b>Strength:</b>
                                ${escapeHtml(
                                    data.strength ||
                                    "Unknown"
                                )}
                            </p>


                            <p>
                                <b>Indication:</b>
                                ${escapeHtml(
                                    data.indication ||
                                    "Unknown"
                                )}
                            </p>


                            <p>
                                <b>Status:</b>
                                ${escapeHtml(status)}
                            </p>


                            <p>
                                <b>Date:</b>
                                ${escapeHtml(dateText)}
                            </p>


                            <div class="order-actions">

                                ${receiptButtonHTML}


                                <button
                                    class="btn btn-approve"
                                    onclick="approveOrder(
                                        '${escapeJs(orderId)}'
                                    )"
                                >
                                    Verify Payment & Approve
                                </button>

                            </div>

                        `;


                        container.appendChild(
                            card
                        );
                    }
                );


                if (!hasPending) {

                    container.innerHTML =
                        "<p>No pending orders at this time.</p>";
                }

            },

            function(error) {

                console.error(
                    "ORDERS LISTENER ERROR:",
                    error
                );


                const container =
                    document.getElementById(
                        "pendingOrders"
                    );


                container.innerHTML = `

                    <div style="
                        background:#c0392b;
                        color:white;
                        padding:15px;
                        border-radius:6px;
                    ">

                        <strong>
                            Failed to load orders
                        </strong>

                        <br><br>

                        ${escapeHtml(
                            error.message ||
                            "Unknown Firebase error"
                        )}

                    </div>

                `;


                showFirebaseError(
                    "Orders read failed: " +
                    error.message
                );
            }
        );
    }


    // =========================================================
    // APPROVE ORDER
    // =========================================================

    async function approveOrder(orderId) {

        if (
            !confirm(
                "Have you verified the InstaPay transfer?\n\n" +
                "Click OK to approve this order and allow " +
                "the Railway AI Engine to process it."
            )
        ) {

            return;
        }


        try {

            console.log(
                "Approving order:",
                orderId
            );


            await db
                .ref(
                    `orders/${orderId}`
                )
                .update({

                    status:
                        "approved"

                });


            console.log(
                "Order approved:",
                orderId
            );


            showSuccess(
                "Order approved successfully. " +
                "The Railway engine will process it."
            );


        } catch (error) {

            console.error(
                "Approval error:",
                error
            );


            alert(
                "Failed to approve order:\n" +
                error.message
            );
        }
    }


    // =========================================================
    // DELETE RECEIPT
    // =========================================================

    async function deleteReceipt(
        orderId,
        receiptUrl
    ) {

        if (
            !confirm(
                "Are you sure you want to permanently " +
                "delete this receipt?"
            )
        ) {

            return;
        }


        try {

            console.log(
                "Deleting receipt:",
                receiptUrl
            );


            // =================================================
            // CONVERT URL TO STORAGE REFERENCE
            // =================================================

            const fileRef =
                storage.refFromURL(
                    receiptUrl
                );


            // =================================================
            // DELETE PHYSICAL FILE
            // =================================================

            await fileRef.delete();


            console.log(
                "Physical receipt file deleted."
            );


            // =================================================
            // REMOVE URL FROM DATABASE
            // =================================================

            await db
                .ref(
                    `orders/${orderId}`
                )
                .update({

                    receipt_url: null

                });


            console.log(
                "Receipt URL removed from database."
            );


            showSuccess(
                "Receipt permanently deleted."
            );


        } catch (error) {

            console.error(
                "Receipt deletion error:",
                error
            );


            alert(
                "Failed to delete receipt:\n" +
                error.message
            );
        }
    }


    // =========================================================
    // SYSTEM HEALTH
    // =========================================================

    function startSystemHealthListener() {

        db.ref("system_health").on(

            "value",

            function(snapshot) {

                const data =
                    snapshot.val();


                const alertBox =
                    document.getElementById(
                        "systemAlert"
                    );


                const details =
                    document.getElementById(
                        "errorDetails"
                    );


                if (
                    data &&
                    data.status === "CRASHED"
                ) {

                    alertBox.style.display =
                        "block";


                    details.innerText =
                        `Error: ${
                            data.error ||
                            "Unknown error"
                        }
                        at ${
                            data.timestamp ||
                            ""
                        }`;

                } else {

                    alertBox.style.display =
                        "none";
                }

            },

            function(error) {

                console.error(
                    "System health listener error:",
                    error
                );
            }
        );
    }


    // =========================================================
    // HTML ESCAPE
    // =========================================================

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    // =========================================================
    // JAVASCRIPT STRING ESCAPE
    // =========================================================

    function escapeJs(value) {

        return String(value)
            .replace(
                /\\/g,
                "\\\\"
            )
            .replace(
                /'/g,
                "\\'"
            )
            .replace(
                /\r/g,
                "\\r"
            )
            .replace(
                /\n/g,
                "\\n"
            );
    }

</script>
