<h1>Comp11 Labs Admin</h1>

<!-- MODE -->
<div>
    <div class="mode-status" id="modeDisplay">

    <button class="btn btn-toggle" onclick="toggleMode()">

</div>

<!-- FIREBASE -->

<!-- ========================================================= -->

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

<script>

    // =========================================================
    // GLOBAL ERROR HANDLER
    // =========================================================

    window.addEventListener("error", function(event) {

        console.error("JavaScript Error:", event.error || event.message);

        showFirebaseError(
            "JavaScript error: " +
            (event.error?.message || event.message)
        );
    });


    // =========================================================
    // ADMIN PASSWORD
    // =========================================================

    const pass = prompt("Enter Admin Password:");

    if (pass !== "kM8$vP3!zQ9#xL2@") {

        document.body.innerHTML =
            "<h2 style='font-family:Arial;padding:30px;'>Access Denied</h2>";

        throw new Error("Wrong password");

    } else {

        document.getElementById("adminPanel").style.display = "block";
    }


    // =========================================================
    // FIREBASE CONFIG
    // =========================================================

    const firebaseConfig = {

        apiKey: "AIzaSyCs40hr-B04Ti0FhUEE0SCg5yJHoCm9VTs",

        authDomain:
            "pharmanamingvault.firebaseapp.com",

        databaseURL:
            "https://pharmanamingvault-default-rtdb.europe-west1.firebasedatabase.app",

        projectId:
            "pharmanamingvault",

        storageBucket:
            "pharmanamingvault.firebasestorage.app",

        messagingSenderId:
            "301633731884",

        appId:
            "1:301633731884:web:b303f30dab1e0d116f4089"
    };


    // =========================================================
    // INITIALIZE FIREBASE
    // =========================================================

    try {

        firebase.initializeApp(firebaseConfig);

        console.log("Firebase initialized successfully.");

    } catch (error) {

        console.error("Firebase initialization error:", error);

        showFirebaseError(
            "Firebase initialization failed: " + error.message
        );
    }


    const db = firebase.database();

    const storage = firebase.storage();

    let currentMode = false;


    // =========================================================
    // SHOW FIREBASE ERROR
    // =========================================================

    function showFirebaseError(message) {

        const box =
            document.getElementById("firebaseError");

        const details =
            document.getElementById("firebaseErrorDetails");

        if (box && details) {

            box.style.display = "block";

            details.innerText = message;
        }
    }


    // =========================================================
    // MODE LISTENER
    // =========================================================

    db.ref("settings/is_paid_mode").on(
        "value",

        function(snapshot) {

            console.log(
                "Mode received:",
                snapshot.val()
            );

            currentMode = snapshot.val() === true;

            const display =
                document.getElementById("modeDisplay");

            if (currentMode) {

                display.innerHTML =
                    'Current Mode: <span class="paid-mode">' +
                    'PAID (InstaPay Required)' +
                    '</span>';

            } else {

                display.innerHTML =
                    'Current Mode: <span class="free-mode">' +
                    'FREE (Auto-Approves)' +
                    '</span>';
            }
        },

        function(error) {

            console.error(
                "Mode listener error:",
                error
            );

            showFirebaseError(
                "Cannot read settings/is_paid_mode: " +
                error.message
            );
        }
    );


    // =========================================================
    // TOGGLE MODE
    // =========================================================

    function toggleMode() {

        const newMode = !currentMode;

        if (
            confirm(
                "Are you sure you want to switch to " +
                (newMode ? "PAID" : "FREE") +
                " mode?"
            )
        ) {

            db.ref("settings/is_paid_mode")
                .set(newMode)

                .then(function() {

                    console.log(
                        "Mode changed to:",
                        newMode
                    );

                })

                .catch(function(error) {

                    console.error(
                        "Mode update error:",
                        error
                    );

                    alert(
                        "Failed to change mode:\n" +
                        error.message
                    );
                });
        }
    }


    // =========================================================
    // ORDERS LISTENER
    // =========================================================

    console.log("Starting orders listener...");


    db.ref("orders").on(

        "value",

        function(snapshot) {

            console.log(
                "Orders snapshot received."
            );

            console.log(
                "Orders exist:",
                snapshot.exists()
            );

            const container =
                document.getElementById(
                    "pendingOrders"
                );

            container.innerHTML = "";

            if (!snapshot.exists()) {

                container.innerHTML =
                    "<p>No orders found in database.</p>";

                return;
            }


            let hasPending = false;

            snapshot.forEach(
                function(childSnapshot) {

                    const orderId =
                        childSnapshot.key;

                    const data =
                        childSnapshot.val();


                    console.log(
                        "Order:",
                        orderId,
                        data
                    );


                    const status =
                        String(
                            data.status || ""
                        ).toLowerCase();


                    // ONLY SHOW THESE STATUSES
                    if (
                        status !== "pending_payment" &&
                        status !== "pending_verification"
                    ) {
                        return;
                    }


                    hasPending = true;


                    // =================================================
                    // RECEIPT
                    // =================================================

                    let receiptButtonHTML = "";


                    if (data.receipt_url) {

                        const safeReceiptUrl =
                            String(data.receipt_url)
                                .replace(/"/g, "&quot;");


                        receiptButtonHTML = `

                            <a
                                href="${safeReceiptUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="receipt-btn">

                                📄 View Evidence

                            </a>

                            <button
                                class="delete-btn"
                                onclick="deleteReceipt(
                                    '${orderId}',
                                    '${safeReceiptUrl}'
                                )">

                                🗑️ Delete File

                            </button>
                        `;

                    } else {

                        receiptButtonHTML = `

                            <span
                                style="
                                    color:#c0392b;
                                    font-size:13px;
                                    font-style:italic;
                                ">

                                No receipt uploaded yet

                            </span>
                        `;
                    }


                    // =================================================
                    // DATE
                    // =================================================

                    let dateText = "Unknown";

                    if (data.timestamp) {

                        const parsedDate =
                            new Date(data.timestamp);

                        if (
                            !isNaN(
                                parsedDate.getTime()
                            )
                        ) {

                            dateText =
                                parsedDate.toLocaleString();
                        }
                    }


                    // =================================================
                    // CARD
                    // =================================================

                    const card =
                        document.createElement("div");

                    card.className = "card";


                    card.innerHTML = `

                        <h3>
                            Company:
                            ${escapeHtml(
                                data.company_name ||
                                "Unknown"
                            )}
                        </h3>

                        <p>
                            <b>API:</b>
                            ${escapeHtml(
                                data.api_name ||
                                "Unknown"
                            )}
                        </p>

                        <p>
                            <b>Email:</b>
                            ${escapeHtml(
                                data.email ||
                                "Unknown"
                            )}
                        </p>

                        <p>
                            <b>Dosage Form:</b>
                            ${escapeHtml(
                                data.dosage_form ||
                                "Unknown"
                            )}
                        </p>

                        <p>
                            <b>Category:</b>
                            ${escapeHtml(
                                data.category ||
                                "Unknown"
                            )}
                        </p>

                        <p>
                            <b>Status:</b>
                            ${escapeHtml(status)}
                        </p>

                        <p>
                            <b>Date:</b>
                            ${dateText}
                        </p>

                        <div class="order-actions">

                            ${receiptButtonHTML}

                            <button
                                class="btn btn-approve"
                                onclick="approveOrder(
                                    '${orderId}'
                                )">

                                Verify Payment & Approve

                            </button>

                        </div>
                    `;


                    container.appendChild(card);
                }
            );


            if (!hasPending) {

                container.innerHTML =
                    "<p>No pending orders at this time.</p>";
            }

        },

        function(error) {

            console.error(
                "ORDERS LISTENER ERROR:",
                error
            );

            const container =
                document.getElementById(
                    "pendingOrders"
                );

            container.innerHTML = `

                <div style="
                    background:#c0392b;
                    color:white;
                    padding:15px;
                    border-radius:6px;
                ">

                    <strong>
                        Failed to load orders
                    </strong>

                    <br><br>

                    ${escapeHtml(
                        error.message ||
                        "Unknown Firebase error"
                    )}

                </div>
            `;

            showFirebaseError(
                "Orders read failed: " +
                error.message
            );
        }
    );


    // =========================================================
    // APPROVE ORDER
    // =========================================================

    function approveOrder(orderId) {

        if (
            confirm(
                "Have you verified the InstaPay transfer? " +
                "Clicking OK will start the AI Engine."
            )
        ) {

            db.ref(
                `orders/${orderId}`
            )
            .update({
                status: "approved"
            })

            .then(function() {

                alert(
                    "Order approved! " +
                    "The Railway engine will start in a few seconds."
                );

            })

            .catch(function(error) {

                console.error(
                    "Approval error:",
                    error
                );

                alert(
                    "Failed to approve order:\n" +
                    error.message
                );
            });
        }
    }


    // =========================================================
    // DELETE RECEIPT
    // =========================================================

    async function deleteReceipt(
        orderId,
        receiptUrl
    ) {

        if (
            !confirm(
                "Are you sure you want to permanently " +
                "delete this receipt?"
            )
        ) {

            return;
        }


        try {

            console.log(
                "Deleting receipt:",
                receiptUrl
            );


            // Convert URL to Firebase Storage reference
            const fileRef =
                storage.refFromURL(
                    receiptUrl
                );


            // Delete physical file
            await fileRef.delete();


            // Remove URL from database
            await db.ref(
                `orders/${orderId}`
            )
            .update({
                receipt_url: null
            });


            alert(
                "Receipt permanently deleted."
            );


        } catch (error) {

            console.error(
                "Receipt deletion error:",
                error
            );

            alert(
                "Failed to delete receipt:\n" +
                error.message
            );
        }
    }


    // =========================================================
    // SYSTEM HEALTH
    // =========================================================

    db.ref("system_health").on(

        "value",

        function(snapshot) {

            const data =
                snapshot.val();

            const alertBox =
                document.getElementById(
                    "systemAlert"
                );

            const details =
                document.getElementById(
                    "errorDetails"
                );


            if (
                data &&
                data.status === "CRASHED"
            ) {

                alertBox.style.display =
                    "block";

                details.innerText =
                    `Error: ${data.error || "Unknown error"}
                     at ${data.timestamp || ""}`;

            } else {

                alertBox.style.display =
                    "none";
            }
        },

        function(error) {

            console.error(
                "System health listener error:",
                error
            );
        }
    );


    // =========================================================
    // HTML ESCAPE
    // =========================================================

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

</script>

</body>
</html>
